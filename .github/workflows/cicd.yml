name: Deploy NodeJS Application to CPANEL

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{secrets.SSH_PORT}}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/hiplstaging2/public_html/cicd.hipl-staging2.com
            git pull
            npm install
            pm2 restart "cicd-backend" || pm2 start npm --name "cicd-backend" -- run dev
            pm2 save

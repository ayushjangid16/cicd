name: Deploy NodeJS Application to CPANEL

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/hiplstaging2/public_html/cicd.hipl-staging2.com
            git pull
            npm ci 
            pm2 save
            pm2 start npm run --name "cicd-backend" -- dev

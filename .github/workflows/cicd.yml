name: Custom CICD pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Git pull
        run: git pull origin main

      - name: Remove old node_modules
        run: rm -rf node_modules

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: npm run dev
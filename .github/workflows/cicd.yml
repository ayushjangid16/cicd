name: Deploy Staging Application

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: self-hosted

    env:
      APP_DIR: /app/cicd
      REPO_URL: https://github.com/ayushjangid16/cicd.git
      BRANCH: main
      APP_NAME: cicd-app
      APP_PORT: 4545

    steps:

      # ---------------------------------------
      # 1. Prepare application directory
      # ---------------------------------------
      - name: Prepare Application Directory
        run: |
          mkdir -p /app

      # ---------------------------------------
      # 2. Clone or Update Repository
      # ---------------------------------------
      - name: Clone or Update Repository
        run: |
          if [ -d "$APP_DIR/.git" ]; then
            echo "Repository already exists."
            echo "Pulling latest changes..."

            cd "$APP_DIR"

            git fetch origin
            git reset --hard "origin/$BRANCH"

          else
            echo "Repository does not exist."
            echo "Cloning repository..."

            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
          fi

      # ---------------------------------------
      # 3. Stop Current Application
      # ---------------------------------------
      - name: Stop Current Application
        run: |
          echo "Stopping current application..."

          pm2 stop "$APP_NAME" || true

      # ---------------------------------------
      # 4. Clean old dependencies
      # ---------------------------------------
      - name: Remove Old Node Modules
        run: |
          cd "$APP_DIR"

          echo "Removing old node_modules..."
          rm -rf node_modules

      # ---------------------------------------
      # 5. Install dependencies
      # ---------------------------------------
      - name: Install Dependencies
        run: |
          cd "$APP_DIR"

          echo "Installing dependencies..."
          npm ci

      # ---------------------------------------
      # 6. Start / Restart Application
      # ---------------------------------------
      - name: Start Application
        run: |
          cd "$APP_DIR"

          echo "Starting application with PM2..."

          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
            pm2 restart "$APP_NAME"
          else
            pm2 start npm \
              --name "$APP_NAME" \
              -- run dev
          fi

          pm2 save

      # ---------------------------------------
      # 7. Check PM2 status
      # ---------------------------------------
      - name: Verify PM2 Application
        run: |
          echo "Checking PM2 status..."

          pm2 status

          if pm2 describe "$APP_NAME" | grep -q "online"; then
            echo "PM2 application is online."
          else
            echo "Application is not online."
            pm2 logs "$APP_NAME" --lines 50 --nostream
            exit 1
          fi

      # ---------------------------------------
      # 8. Health Check
      # ---------------------------------------
      - name: Health Check
        run: |
          echo "Waiting for application to start..."

          for i in {1..10}; do
            if curl -f "http://localhost:$APP_PORT" > /dev/null 2>&1; then
              echo "Application is live on port $APP_PORT."
              exit 0
            fi

            echo "Application not ready yet... attempt $i/10"
            sleep 2
          done

          echo "Application failed health check."

          echo "PM2 status:"
          pm2 status

          echo "Application logs:"
          pm2 logs "$APP_NAME" --lines 50 --nostream

          exit 1
name: Deploy Staging Application

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: self-hosted

    env:
      APP_DIR: /app/cicd
      REPO_URL: https://github.com/ayushjangid16/cicd.git
      BRANCH: main
      APP_NAME: cicd-app
      APP_PORT: 4545

    steps:

      # =======================================
      # 1. Prepare application directory
      # =======================================
      - name: Prepare Application Directory
        run: |
          echo "Preparing application directory..."

          mkdir -p /app

      # =======================================
      # 2. Clone or Update Repository
      # =======================================
      - name: Clone or Update Repository
        run: |
          if [ -d "$APP_DIR/.git" ]; then
            echo "Repository already exists."
            echo "Fetching latest changes..."

            cd "$APP_DIR"

            git fetch origin
            git reset --hard "origin/$BRANCH"

          else
            echo "Repository does not exist."
            echo "Cloning repository..."

            git clone \
              --branch "$BRANCH" \
              "$REPO_URL" \
              "$APP_DIR"
          fi

      # =======================================
      # 3. Stop Existing Application
      # =======================================
      - name: Stop Existing Application
        run: |
          echo "Checking existing PM2 application..."

          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
            echo "Stopping $APP_NAME..."

            pm2 stop "$APP_NAME"

          else
            echo "No existing application found."
          fi

      # =======================================
      # 4. Remove Old Node Modules
      # =======================================
      - name: Remove Old Node Modules
        run: |
          cd "$APP_DIR"

          echo "Removing old node_modules..."

          rm -rf node_modules

      # =======================================
      # 5. Install Dependencies
      # =======================================
      - name: Install Dependencies
        run: |
          cd "$APP_DIR"

          echo "Installing dependencies..."

          npm ci

      # =======================================
      # 6. Start Application with PM2
      # =======================================
      - name: Start Application
        run: |
          cd "$APP_DIR"

          echo "Starting application..."

          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then

            echo "Application already exists in PM2."
            echo "Restarting application..."

            RUNNER_TRACKING_ID="" pm2 restart "$APP_NAME"

          else

            echo "Application does not exist in PM2."
            echo "Starting new application..."

            RUNNER_TRACKING_ID="" pm2 start npm \
              --name "$APP_NAME" \
              --cwd "$APP_DIR" \
              -- run dev

          fi

          echo "Saving PM2 process list..."

          RUNNER_TRACKING_ID="" pm2 save

      # =======================================
      # 7. Verify PM2 Status
      # =======================================
      - name: Verify PM2 Application
        run: |
          echo "Checking PM2 status..."

          pm2 status

          if pm2 describe "$APP_NAME" | grep -q "online"; then
            echo "PM2 application is online."
          else
            echo "Application is NOT online."

            echo "Showing application logs..."

            pm2 logs "$APP_NAME" \
              --lines 50 \
              --nostream

            exit 1
          fi

      # =======================================
      # 8. Health Check
      # =======================================
      - name: Health Check
        run: |
          echo "Checking application health..."

          for i in {1..10}; do

            if curl -f \
              "http://localhost:$APP_PORT" \
              > /dev/null 2>&1; then

              echo "======================================"
              echo "Application is LIVE!"
              echo "Port: $APP_PORT"
              echo "======================================"

              exit 0

            fi

            echo "Application not ready yet..."
            echo "Attempt $i/10"

            sleep 2

          done

          echo "======================================"
          echo "Application health check FAILED"
          echo "======================================"

          echo ""
          echo "PM2 status:"
          pm2 status

          echo ""
          echo "Application logs:"
          pm2 logs "$APP_NAME" \
            --lines 50 \
            --nostream

          exit 1